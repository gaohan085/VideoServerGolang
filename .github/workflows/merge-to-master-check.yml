name: "NodeJS with RsBuild"
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        name: Install pnpm
        with:
          runtime: node@${{ matrix.node-version }}

      - name: Build
        run: pnpm build
