version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: "monthly"
      time: "12:00"
      timezone: "Asia/Shanghai"
    ignore:
      - dependency-name: "plyr"
      - dependency-name: "react-error-boundary"
    groups:
      nodejs-dependencies:
        patterns:
          - "axios"
          - "react"
          - "react-dom"
          - "react-icons"
          - "swr"
          - "motion"
          - "@types/node"
          - "@types/react"
          - "@types/react-dom"
          - "vite"
          - "@vitejs/plugin-react"
          - "sass"
          - "typescript"
          - "zustand"
          - "@tanstack/react-form"
          - "@tanstack/react-router"
          - "@tanstack/react-router-devtools"
          - "@tanstack/react-router-plugin"
          - "zod"
          - "oxlint"
          - "cross-env"
          - "oxlint-tsgolint"
          - "js-base64"
          - "@stylistic/eslint-plugin"
  - package-ecosystem: "gomod"
    schedule:
      interval: "monthly"
      time: "12:00"
      timezone: "Asia/Shanghai"
    directory: "/"
    reviewers:
      - "gaohan085"
    groups:
      golang-dependencies:
        patterns:
          - "*"
